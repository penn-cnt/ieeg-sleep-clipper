    ### Parameters for each BIDS path:
    # subject: Subject ID
    # session: Session
    # datatype: Data type (e.g., ieeg)
    # task: Task
    # run: Run number
    # suffix: Suffix for the data files
    # extension: File extension
    # staging_methods: List of staging methods to apply (e.g. yasa, ad_scalp, ad_ieeg, ad_all, sleep_seeg)
    # stage_full_recording: If True, stage the full recording; if False, use window_start and window_stop
    # window_start: Start time in seconds for staging (if stage_full_recording is False)
    # window_stop: Stop time in seconds for staging (if stage_full_recording is False)
    # save_figures: If True, save hypnogram figures to disk
    bids_path_list:
        - subject: umich0020
          session: ieeg01
          datatype: ieeg
          task: all
          run: "01"
          suffix: ieeg
          extension: .lay
          staging_methods:
            - sleep_seeg
          stage_full_recording: False
          window_start: 18000
          window_stop: 21600
          save_figures: True
        - subject: umich0020
